services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blitzprints
      POSTGRES_USER: blitz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blitz -d blitzprints"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blitz:${POSTGRES_PASSWORD}@db:5432/blitzprints
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    ports:
      - "${WEBSITE_PORT:-8000}:8000"

volumes:
  pgdata:
